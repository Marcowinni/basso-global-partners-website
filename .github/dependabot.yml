version: 2

updates:
  # Serverless dependencies (root package-lock.json). If a PR bumps
  # @vercel/blob, bump the esm.sh client pin in js/admin.js to match and
  # re-test a news upload before merging.
  # Grouped into one PR/week so a solo maintainer reviews upgrades in one pass
  # instead of drowning in per-package noise. Majors are separated out so a
  # breaking bump is never silently folded into a routine group.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      majors:
        update-types: [major]

  # Keep the CI actions themselves patched (the workflow pins major-version tags).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
